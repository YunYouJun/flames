name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck

  test:
    name: Build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
      fail-fast: false

    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm docs:build

  static:
    name: Generate all flame routes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm generate
      - run: pnpm budget:web

  e2e:
    name: Browser tests (${{ matrix.project }}, ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, mobile]
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm generate
      # Shard expensive three-tier captures separately: count-based sharding of
      # the whole suite otherwise puts twenty captures on the first runner.
      # Both deadlines leave time for build setup and failure evidence upload.
      - name: Accept all flame visuals
        run: pnpm e2e tests/e2e/acceptance.spec.ts --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 --fully-parallel --workers=1 --reporter=line --global-timeout=900000 --output=test-results/acceptance
      - name: Check routes, gestures and rendering contracts
        run: pnpm e2e 'tests/e2e/(?!acceptance\.spec\.ts$).*\.spec\.ts$' --project=${{ matrix.project }} --shard=${{ matrix.shard }}/4 --fully-parallel --workers=1 --reporter=line --global-timeout=600000 --output=test-results/experience
      - uses: actions/upload-artifact@v7
        if: ${{ failure() || cancelled() }}
        with:
          name: browser-failures-${{ matrix.project }}-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
